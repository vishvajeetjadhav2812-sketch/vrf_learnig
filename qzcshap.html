
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C# Basics to OOPs Quiz (50 Questions)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 700px;
            padding: 30px;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #eef0f3;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #68217a;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #e0e0e0;
            height: 10px;
            border-radius: 5px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #68217a;
            transition: width 0.3s ease;
        }

        .question-number {
            font-size: 14px;
            color: #5f6368;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 18px;
            color: #202124;
            margin-bottom: 20px;
            font-weight: 500;
            line-height: 1.4;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #dadce0;
            border-radius: 8px;
            padding: 14px 18px;
            font-size: 16px;
            color: #3c4043;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .option-btn:hover {
            background-color: #f3e8f7;
            border-color: #68217a;
        }

        .option-btn.correct {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
            font-weight: bold;
        }

        .option-btn.incorrect {
            background-color: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
            font-weight: bold;
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            display: none;
        }

        .result-box.correct-msg {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result-box.incorrect-msg {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .next-btn {
            margin-top: 25px;
            background-color: #68217a;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            display: none;
        }

        .next-btn:hover {
            background-color: #521862;
        }

        .score-container {
            text-align: center;
            display: none;
        }

        .score-container h2 {
            color: #202124;
            margin-bottom: 15px;
        }

        .score-text {
            font-size: 22px;
            color: #68217a;
            margin-bottom: 25px;
        }

        .restart-btn {
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .restart-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h1>C# Basics to OOPs Quiz</h1>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <div id="quiz-box">
        <div class="question-number" id="question-number">Question 1 of 50</div>
        <div class="question-text" id="question-text">Loading question...</div>
        
        <div class="options-container" id="options-container">
            <!-- Options dynamically loaded -->
        </div>

        <div class="result-box" id="result-box"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question</button>
    </div>

    <div class="score-container" id="score-container">
        <h2>Quiz Completed!</h2>
        <div class="score-text" id="score-text">You scored 0 out of 50</div>
        <button class="restart-btn" onclick="restartQuiz()">Restart Quiz</button>
    </div>
</div>

<script>
    const quizData = [
        // --- BASICS & FUNDAMENTALS ---
        { question: "Which company developed the C# programming language?", options: ["Sun Microsystems", "Oracle", "Microsoft", "Google"], correct: 2 },
        { question: "What component of .NET executes C# programs?", options: ["JVM", "CLR (Common Language Runtime)", "JDK", "PVM"], correct: 1 },
        { question: "Which extension is used for C# code files?", options: [".cp", ".cs", ".csharp", ".dotnet"], correct: 1 },
        { question: "What is the correct entry point method in a standard C# Console Application?", options: ["static void Main(string[] args)", "public int main()", "void start()", "static void Run()"], correct: 0 },
        { question: "Which method is used to print text to the console with a new line in C#?", options: ["Console.PrintLine()", "Console.WriteLine()", "System.out.println()", "printf()"], correct: 1 },
        { question: "Which keyword allows implicit type declaration where the compiler infers the type?", options: ["dynamic", "auto", "var", "object"], correct: 2 },
        { question: "Which data type is used to store high-precision financial or monetary values in C#?", options: ["float", "double", "decimal", "long"], correct: 2 },
        { question: "What is the default value of a boolean variable in C#?", options: ["true", "false", "0", "null"], correct: 1 },
        { question: "Which statement correctly creates a constant variable in C#?", options: ["final int x = 10;", "const int x = 10;", "static readonly int x = 10;", "val x = 10;"], correct: 1 },
        { question: "Which of the following is a value type stored on the stack in C#?", options: ["Class", "String", "Struct", "Array"], correct: 2 },

        // --- CONTROL FLOW & DATA STRUCTURES ---
        { question: "How do you check both value and type in a pattern-matching switch statement?", options: ["switch case with 'when' clause", "switch case with 'if' clause", "check() statement", "match statement"], correct: 0 },
        { question: "Which loop is guaranteed to run at least once?", options: ["for", "while", "do-while", "foreach"], correct: 2 },
        { question: "Which loop is specifically designed to iterate over collections and arrays in C#?", options: ["for", "while", "foreach", "repeat"], correct: 2 },
        { question: "How do you declare a single-dimensional array of integers in C#?", options: ["int[] numbers = new int[5];", "int numbers = new int[5];", "Array numbers = new int[5];", "int numbers[] = new int[5];"], correct: 0 },
        { question: "Which property gives the total number of elements in an array in C#?", options: ["Length", "Count", "Size", "Capacity"], correct: 0 },
        { question: "What is Boxing in C#?", options: ["Converting a value type to a reference type (object)", "Converting a reference type to a value type", "Creating a new struct", "Garbage collection process"], correct: 0 },
        { question: "What is Unboxing in C#?", options: ["Converting an object type explicitly back to a value type", "Converting a value type to object", "Deleting an object", "Memory allocation"], correct: 0 },
        { question: "Which operator is the null-coalescing operator in C#?", options: ["??", "?.", "?:", "!!"], correct: 0 },
        { question: "Which operator is used for Null-Conditional access in C#?", options: ["??", "?.", "?:", "->"], correct: 1 },
        { question: "How do you handle string interpolation in C#?", options: ["$\"Hello {name}\"", "@\"Hello {name}\"", "#\"Hello {name}\"", "%\"Hello {name}\""], correct: 0 },

        // --- CORE OOPS CONCEPTS ---
        { question: "Which keyword is used to inherit a class or implement an interface in C#?", options: ["extends", "implements", ": (colon)", "inherits"], correct: 2 },
        { question: "Does C# support multiple class inheritance directly?", options: ["Yes", "No", "Only with struct", "Only in .NET Core"], correct: 1 },
        { question: "Which access modifier allows access within the same assembly or derived classes in another assembly?", options: ["protected", "internal", "protected internal", "private protected"], correct: 2 },
        { question: "Which access modifier restricts access strictly within the current assembly?", options: ["private", "internal", "protected", "sealed"], correct: 1 },
        { question: "Which keyword prevents a class from being inherited by other classes?", options: ["final", "sealed", "static", "abstract"], correct: 1 },
        { question: "Which keyword allows a method in a base class to be overridden in a derived class?", options: ["virtual", "override", "abstract", "new"], correct: 0 },
        { question: "Which keyword is used in a derived class to provide a new implementation of a virtual method?", options: ["virtual", "override", "extends", "shadows"], correct: 1 },
        { question: "How do you explicitly hide a base class member instead of overriding it?", options: ["hide keyword", "new keyword", "shadow keyword", "override keyword"], correct: 1 },
        { question: "Which keyword is used to refer to the base class members from a derived class?", options: ["this", "super", "base", "parent"], correct: 2 },
        { question: "Having multiple methods in the same class with the same name but different signature is:", options: ["Method Overriding", "Method Overloading", "Method Shadowing", "Method Hiding"], correct: 1 },

        // --- PROPERTIES, CONSTRUCTORS & ENCAPSULATION ---
        { question: "What are Auto-Implemented Properties in C#?", options: ["public int Age { get; set; }", "public int Age();", "int Age = get set;", "property int Age;"], correct: 0 },
        { question: "What is a Static Constructor in C# used for?", options: ["To initialize static data or perform actions needed only once", "To construct every object instance", "To destroy static fields", "To construct structs"], correct: 0 },
        { question: "Can a static constructor take parameters in C#?", options: ["Yes", "No", "Only string parameters", "Only int parameters"], correct: 1 },
        { question: "What is a Constructor Chaining keyword inside the same class?", options: ["base()", "this()", "self()", "parent()"], correct: 1 },
        { question: "Which access level makes properties read-only from outside but set-able within the class?", options: ["get; private set;", "get; internal set;", "read; set;", "get; protected set;"], correct: 0 },

        // --- ADVANCED OOPS, INTERFACES & DELEGATES ---
        { question: "Can an interface in C# contain field variables?", options: ["Yes", "No", "Only static fields", "Only private fields"], correct: 1 },
        { question: "By default, what is the default access modifier for members of an interface in C#?", options: ["private", "protected", "public", "internal"], correct: 2 },
        { question: "What is a Delegate in C#?", options: ["A type-safe function pointer", "A class destructor", "A memory allocator", "A database connector"], correct: 0 },
        { question: "Which built-in delegate returns a value in C#?", options: ["Action", "Func", "Predicate", "EventHandler"], correct: 1 },
        { question: "Which built-in delegate does NOT return a value (void)?", options: ["Func", "Action", "Predicate", "Converter"], correct: 1 },
        { question: "Which built-in delegate always returns a boolean?", options: ["Func", "Action", "Predicate", "FuncBool"], correct: 2 },
        { question: "What is an Event in C#?", options: ["A encapsulated delegate that enables a class to provide notifications", "A special loop", "A garbage collection handler", "A thread process"], correct: 0 },
        { question: "Which keyword is used to pass arguments by reference so changes affect the original variable?", options: ["out", "ref", "in", "params"], correct: 1 },
        { question: "Which parameter keyword allows passing a variable number of arguments to a method?", options: ["args", "params", "varargs", "ref"], correct: 1 },
        { question: "Which keyword is used for parameters that must be initialized inside the method before returning?", options: ["ref", "out", "in", "params"], correct: 1 },
        { question: "What is an Extension Method in C#?", options: ["A static method in a static class with 'this' modifier on first parameter", "A method declared in an interface", "An overridden method", "A lambda expression"], correct: 0 },
        { question: "Which feature allows querying collections using SQL-like syntax directly in C#?", options: ["ADO.NET", "LINQ (Language Integrated Query)", "EF Core", "Reflection"], correct: 1 },
        { question: "What is the Garbage Collector (GC) responsible for in .NET?", options: ["Compiling C# code", "Managing memory by freeing unreferenced objects on the heap", "Managing stack memory", "Handling multi-threading"], correct: 1 },
        { question: "Which interface should be implemented to perform deterministic unmanaged resource cleanup?", options: ["IUnknown", "IDisposable", "ICloneable", "IComparable"], correct: 1 },
        { question: "Which block ensures that Dispose() is called on an IDisposable object automatically?", options: ["using block", "try-catch block", "lock block", "fixed block"], correct: 0 }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const questionNumberEl = document.getElementById("question-number");
    const questionTextEl = document.getElementById("question-text");
    const optionsContainerEl = document.getElementById("options-container");
    const resultBoxEl = document.getElementById("result-box");
    const nextBtnEl = document.getElementById("next-btn");
    const progressBarEl = document.getElementById("progress-bar");
    const quizBoxEl = document.getElementById("quiz-box");
    const scoreContainerEl = document.getElementById("score-container");
    const scoreTextEl = document.getElementById("score-text");

    function loadQuestion() {
        const currentQuiz = quizData[currentQuestionIndex];
        
        questionNumberEl.innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
        questionTextEl.innerText = currentQuiz.question;
        progressBarEl.style.width = `${((currentQuestionIndex + 1) / quizData.length) * 100}%`;

        optionsContainerEl.innerHTML = "";
        resultBoxEl.style.display = "none";
        nextBtnEl.style.display = "none";

        currentQuiz.options.forEach((option, index) => {
            const button = document.createElement("button");
            button.classList.add("option-btn");
            button.innerText = option;
            button.onclick = () => selectOption(index, button);
            optionsContainerEl.appendChild(button);
        });
    }

    function selectOption(selectedIndex, selectedBtn) {
        const currentQuiz = quizData[currentQuestionIndex];
        const allButtons = optionsContainerEl.querySelectorAll(".option-btn");

        allButtons.forEach(btn => btn.disabled = true);

        if (selectedIndex === currentQuiz.correct) {
            selectedBtn.classList.add("correct");
            resultBoxEl.className = "result-box correct-msg";
            resultBoxEl.innerText = "YES! Correct Answer! 🎉";
            score++;
        } else {
            selectedBtn.classList.add("incorrect");
            allButtons[currentQuiz.correct].classList.add("correct");
            resultBoxEl.className = "result-box incorrect-msg";
            resultBoxEl.innerText = "NOT CORRECT! Wrong Answer. ❌";
        }

        resultBoxEl.style.display = "block";
        nextBtnEl.style.display = "block";
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showScore();
        }
    }

    function showScore() {
        quizBoxEl.style.display = "none";
        scoreContainerEl.style.display = "block";
        scoreTextEl.innerText = `You scored ${score} out of ${quizData.length}!`;
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        quizBoxEl.style.display = "block";
        scoreContainerEl.style.display = "none";
        loadQuestion();
    }

    // Start Quiz
    loadQuestion();
</script>

</body>
</html>
