<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRA Learning - Registered Users</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  body {
    background:
      radial-gradient(circle at 15% 0%, rgba(99, 102, 241, 0.14), transparent 45%),
      radial-gradient(circle at 85% 10%, rgba(56, 189, 248, 0.10), transparent 40%),
      #05070f;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 2.5rem 1.5rem 3rem;
  }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
  }

  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 1.8rem;
  }

  h2 {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .count-chip {
    font-size: 0.78rem;
    font-weight: 700;
    color: #a5b4fc;
    background: rgba(129, 140, 248, 0.12);
    border: 1px solid rgba(129, 140, 248, 0.3);
    padding: 5px 14px;
    border-radius: 999px;
  }

  .card {
    background: linear-gradient(160deg, rgba(255,255,255,0.045), rgba(255,255,255,0.01));
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.6);
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead tr {
    background: rgba(59, 130, 246, 0.12);
  }

  th {
    text-align: left;
    padding: 14px 16px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #93c5fd;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  td {
    padding: 13px 16px;
    font-size: 0.92rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    color: #cbd5e1;
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  tbody tr:hover {
    background: rgba(255, 255, 255, 0.03);
  }

  td.idx {
    color: #64748b;
    font-variant-numeric: tabular-nums;
  }

  .empty-row td {
    text-align: center;
    padding: 2.6rem 1rem;
    color: #64748b;
    font-size: 0.95rem;
  }

  .empty-row .empty-icon {
    font-size: 1.6rem;
    display: block;
    margin-bottom: 8px;
  }

  .actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 1.4rem;
  }

  .clear-btn {
    background: linear-gradient(120deg, #ef4444, #b91c1c);
    color: white;
    border: none;
    padding: 10px 18px;
    cursor: pointer;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    box-shadow: 0 8px 20px -6px rgba(239, 68, 68, 0.45);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  .clear-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px -6px rgba(239, 68, 68, 0.55);
  }

  .clear-btn:active {
    transform: translateY(0);
  }

  @media (max-width: 640px) {
    .card { overflow-x: auto; }
    table { min-width: 480px; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="page-header">
      <h2>👥 Registered Users</h2>
      <span class="count-chip" id="countChip">0 users</span>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th style="width:48px;">#</th>
            <th>Full Name</th>
            <th>Email Address</th>
            <th>Date &amp; Time</th>
          </tr>
        </thead>
        <tbody id="userTableBody"></tbody>
      </table>
    </div>

    <div class="actions">
      <button class="clear-btn" onclick="clearData()">Clear All Users Data</button>
    </div>
  </div>

  <script>
    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function getKey() {
      let key = sessionStorage.getItem('vra_admin_key');
      if (!key) {
        key = prompt('Enter admin key:') || '';
        if (key) sessionStorage.setItem('vra_admin_key', key);
      }
      return key;
    }

    async function loadUsers() {
      const tableBody = document.getElementById('userTableBody');
      const countChip = document.getElementById('countChip');
      let users = [];
      try {
        const res = await fetch('/api/users', { headers: { 'x-admin-key': getKey() } });
        if (res.status === 401) {
          sessionStorage.removeItem('vra_admin_key');
          tableBody.innerHTML = '<tr class="empty-row"><td colspan="4">Invalid admin key - refresh and try again</td></tr>';
          return;
        }
        users = (await res.json()).users || [];
      } catch (e) {
        tableBody.innerHTML = '<tr class="empty-row"><td colspan="4">Server not running. Start it with: node server.js</td></tr>';
        return;
      }
      tableBody.innerHTML = '';
      countChip.textContent = users.length + (users.length === 1 ? ' user' : ' users');

      if (users.length === 0) {
        tableBody.innerHTML = `<tr class="empty-row">
          <td colspan="4"><span class="empty-icon">🗒️</span>No data available yet</td>
        </tr>`;
        return;
      }

      users.forEach((u, index) => {
        tableBody.innerHTML += `<tr>
          <td class="idx">${index + 1}</td>
          <td>${escapeHtml(u.name)}</td>
          <td>${escapeHtml(u.email)}</td>
          <td>${escapeHtml(u.created_at)}</td>
        </tr>`;
      });
    }

    async function clearData() {
      if (!confirm('Delete all user data? This cannot be undone.')) return;
      await fetch('/api/users', { method: 'DELETE', headers: { 'x-admin-key': getKey() } });
      loadUsers();
    }

    loadUsers();
  </script>
</body>
</html>
