<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Quiz - VRA Learning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0d0e14;
            --bg-secondary: #171a24;
            --bg-tertiary: #1d212d;
            --text-primary: #f2ede2;
            --text-secondary: #9aa1b4;
            --border-color: #272b38;
            --accent: #e44d26;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
        header { background-color: var(--bg-secondary); border-bottom: 1px solid var(--border-color); padding: 1.1rem 2.5rem; display: flex; justify-content: space-between; align-items: center; }
        .brand-logo { font-family: 'Fraunces', serif; font-size: 1.5rem; text-decoration: none; color: var(--text-primary); }
        .brand-logo span { color: var(--accent); }
        .quiz-container { max-width: 700px; margin: 3rem auto; padding: 2rem; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; }
        .q-header { display: flex; justify-content: space-between; margin-bottom: 1.5rem; color: var(--text-secondary); font-size: 0.9rem; }
        .question { font-size: 1.2rem; margin-bottom: 1.5rem; line-height: 1.5; font-weight: 500; }
        .options { display: flex; flex-direction: column; gap: 0.8rem; }
        .opt-btn { background: var(--bg-tertiary); border: 1px solid var(--border-color); color: var(--text-primary); padding: 0.9rem 1.2rem; border-radius: 6px; text-align: left; cursor: pointer; font-size: 0.95rem; transition: all 0.2s; }
        .opt-btn:hover { border-color: var(--accent); }
        .opt-btn.correct { background: #1e3a29; border-color: #4CAF50; color: #a3e2a5; }
        .opt-btn.wrong { background: #3a1e1e; border-color: #f44336; color: #e2a3a3; }
        .footer-nav { margin-top: 2rem; display: flex; justify-content: space-between; align-items: center; }
        .next-btn { background: var(--accent); color: #fff; border: none; padding: 0.7rem 1.5rem; border-radius: 4px; cursor: pointer; font-weight: 600; display: none; }
        .score-box { text-align: center; padding: 2rem 0; }
        .score-box h2 { font-family: 'Fraunces', serif; font-size: 2rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <header>
        <a href="qz_section.html" class="brand-logo"><span>VRA</span> HTML Quiz</a>
    </header>

    <div class="quiz-container">
        <div id="quiz-box">
            <div class="q-header">
                <span id="q-count">Question 1 of 3</span>
                <span id="score-tracker">Score: 0</span>
            </div>
            <div class="question" id="question-text">Loading question...</div>
            <div class="options" id="options-container"></div>
            <div class="footer-nav">
                <div></div>
                <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question &rarr;</button>
            </div>
        </div>
        <div id="result-box" class="score-box" style="display: none;">
            <h2>Quiz Completed!</h2>
            <p id="final-score" style="font-size: 1.2rem; color: var(--text-secondary); margin-bottom: 2rem;"></p>
            <a href="qz_section.html" style="color: var(--accent); text-decoration: none; font-weight: 600;">&larr; Back to Quizzes</a>
        </div>
    </div>

    <script>
    const questions = [
        { q: "What is the full form of HTML?", options: ["Hyper Text Markup Language", "High Text Machine Language", "Hyperlink and Text Marking", "Home Tool Markup Language"], answer: 0 },
        { q: "Which is the root element of a web page?", options: ["<head>", "<body>", "<html>", "<root>"], answer: 2 },
        { q: "Which is the largest heading tag?", options: ["<h6>", "<head>", "<h1>", "<heading>"], answer: 2 },
        { q: "Which tag is used to add a line break?", options: ["<break>", "<lb>", "<br>", "<hr>"], answer: 2 },
        { q: "Which tag is used to create a hyperlink?", options: ["<a>", "<link>", "<href>", "<url>"], answer: 0 },
        { q: "Which tag is used to create an unordered list?", options: ["<ol>", "<ul>", "<list>", "<li>"], answer: 1 },
        { q: "Which tag is used for an ordered list?", options: ["<ul>", "<ol>", "<li>", "<dl>"], answer: 1 },
        { q: "Which attribute specifies the URI/path for inserting an image?", options: ["link", "href", "src", "path"], answer: 2 },
        { q: "Which attribute is used for alternate text in an image tag?", options: ["alt", "title", "text", "desc"], answer: 0 },
        { q: "Which attribute is used to open a link in a new tab?", options: ["target='_self'", "target='_blank'", "target='_new'", "open='blank'"], answer: 1 },
        { q: "Which tag is used to embed a video in HTML5?", options: ["<media>", "<video>", "<movie>", "<embed>"], answer: 1 },
        { q: "Which tag is used to add audio in HTML5?", options: ["<sound>", "<audio>", "<music>", "<voice>"], answer: 1 },
        { q: "What will be the input type to create a checkbox?", options: ["type='box'", "type='checkbox'", "type='check'", "type='square'"], answer: 1 },
        { q: "What should be the input type for a radio button?", options: ["type='radio'", "type='circle'", "type='option'", "type='button'"], answer: 0 },
        { q: "How do you create a button that submits form data?", options: ["<input type='submit'>", "<button action='submit'>", "<submit>", "<input type='post'>"], answer: 0 },
        { q: "Which element is used to create a drop-down list?", options: ["<input type='dropdown'>", "<select>", "<list>", "<dropdown>"], answer: 1 },
        { q: "Which tag is used for items inside a drop-down menu?", options: ["<item>", "<option>", "<list-item>", "<choices>"], answer: 1 },
        { q: "Which tag is used for a multiline text input field?", options: ["<input type='textarea'>", "<textbox>", "<textarea>", "<input type='multiline'>"], answer: 2 },
        { q: "Which tag is used to create a row in a table?", options: ["<td>", "<th>", "<tr>", "<row>"], answer: 2 },
        { q: "Which tag is used for a table data cell?", options: ["<tr>", "<td>", "<th>", "<table-data>"], answer: 1 },
        { q: "Which tag is used for a table header cell?", options: ["<head>", "<th>", "<td>", "<header>"], answer: 1 },
        { q: "Which tag is used to add a horizontal line/rule?", options: ["<line>", "<br>", "<hr>", "<border>"], answer: 2 },
        { q: "Where is document metadata (title, styles, scripts) kept?", options: ["<body>", "<head>", "<meta>", "<footer>"], answer: 1 },
        { q: "Which tag is used to set the title on the browser tab?", options: ["<head>", "<meta>", "<title>", "<header>"], answer: 2 },
        { q: "Which attribute is used to add inline CSS?", options: ["css", "style", "styles", "class"], answer: 1 },
        { q: "Which semantic tag wraps navigation links?", options: ["<nav>", "<menu>", "<navbar>", "<links>"], answer: 0 },
        { q: "Which HTML5 semantic tag is used for footer content?", options: ["<bottom>", "<footer>", "<end>", "<section>"], answer: 1 },
        { q: "Which semantic tag is used for independent or self-contained content?", options: ["<section>", "<div>", "<article>", "<aside>"], answer: 2 },
        { q: "Which semantic tag is used for sidebar content?", options: ["<sidebar>", "<aside>", "<subSection>", "<nav>"], answer: 1 },
        { q: "Which of these is a self-closing / void tag?", options: ["<div>", "<p>", "<img>", "<span>"], answer: 2 },
        { q: "Which semantic tag makes text bold?", options: ["<b>", "<strong>", "<bold>", "<heavy>"], answer: 1 },
        { q: "Which semantic tag makes text italic?", options: ["<i>", "<em>", "<italic>", "<address>"], answer: 1 },
        { q: "Which tag provides a text description for a form input control?", options: ["<label>", "<caption font>", "<name>", "<p>"], answer: 0 },
        { q: "Which attribute makes an input field mandatory/required?", options: ["validate", "required", "needed", "important"], answer: 1 },
        { q: "Which attribute displays background hint text inside an input field?", options: ["hint", "value", "placeholder", "text"], answer: 2 },
        { q: "What is the correct Doctype declaration for an HTML document?", options: ["<!DOCTYPE html>", "<doctype html5>", "<html doctype>", "<?xml html>"], answer: 0 },
        { q: "Which tag is used to link an external CSS file?", options: ["<style src='...'>", "<link rel='stylesheet' href='...'>", "<script src='...'>", "<css href='...'>"], answer: 1 },
        { q: "Which is the generic block-level container tag?", options: ["<span>", "<div>", "<section>", "<group>"], answer: 1 },
        { q: "Which is the generic inline container tag?", options: ["<div>", "<span>", "<text>", "<label>"], answer: 1 },
        { q: "Which attribute combines multiple columns in a table?", options: ["rowspan", "colspan", "cellspan", "merge-col"], answer: 1 },
        { q: "Which attribute combines multiple rows in a table?", options: ["colspan", "rowspan", "merge-row", "rowmerge"], answer: 1 },
        { q: "What is the correct syntax for writing an HTML comment?", options: ["// comment", "/* comment */", "<!-- comment -->", "' comment"], answer: 2 },
        { q: "Which attribute defines the minimum value for a number input?", options: ["start", "min", "lowest", "limit"], answer: 1 },
        { q: "Which meta tag attribute is used to specify character encoding?", options: ["charset", "encoding", "code", "lang"], answer: 0 },
        { q: "What is the primary use of an iframe?", options: ["Displaying images", "Embedding another web page", "Loading CSS", "Submitting forms"], answer: 1 },
        { q: "Which universal attribute is used to add tooltip text?", options: ["tooltip", "title", "hover", "info"], answer: 1 },
        { q: "Which tag is used as an HTML5 graphic drawing container?", options: ["<canvas>", "<draw>", "<paint>", "<graphics>"], answer: 0 },
        { q: "Which attribute specifies the primary language of an HTML page?", options: ["lang", "language", "code", "locale"], answer: 0 },
        { q: "Which form submission method hides data from the URL?", options: ["GET", "POST", "PUT", "SEND"], answer: 1 },
        { q: "Values of HTML element attributes should always be enclosed in what?", options: ["Quotes (\" \")", "Parenthesis ( )", "Brackets [ ]", "Semicolons"], answer: 0 }
    ];

        let currentQ = 0;
        let score = 0;

        function loadQuestion() {
            const q = questions[currentQ];
            document.getElementById("q-count").innerText = `Question ${currentQ + 1} of ${questions.length}`;
            document.getElementById("question-text").innerText = q.q;
            const container = document.getElementById("options-container");
            container.innerHTML = "";
            document.getElementById("next-btn").style.display = "none";

            q.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "opt-btn";
                btn.innerText = opt;
                btn.onclick = () => selectOption(idx, btn);
                container.appendChild(btn);
            });
        }

        function selectOption(idx, btn) {
            const btns = document.querySelectorAll(".opt-btn");
            btns.forEach(b => b.style.pointerEvents = "none");
            
            if(idx === questions[currentQ].answer) {
                btn.classList.add("correct");
                score++;
                document.getElementById("score-tracker").innerText = `Score: ${score}`;
            } else {
                btn.classList.add("wrong");
                btns[questions[currentQ].answer].classList.add("correct");
            }
            document.getElementById("next-btn").style.display = "block";
        }

        function nextQuestion() {
            currentQ++;
            if(currentQ < questions.length) {
                loadQuestion();
            } else {
                document.getElementById("quiz-box").style.display = "none";
                document.getElementById("result-box").style.display = "block";
                document.getElementById("final-score").innerText = `You scored ${score} out of ${questions.length}!`;
            }
        }

        loadQuestion();
    </script>
</body>
</html>
